<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Mario Web - Completo</title>
    <style>
        body { margin: 0; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; font-family: 'Arial', sans-serif; }
        #game-container { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16 / 9; background-color: #5C94FC; border: 4px solid #000; overflow: hidden; }
        canvas { width: 100%; height: 100%; image-rendering: pixelated; }
        
        /* Controles Mobile */
        .controls { position: absolute; bottom: 15px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; pointer-events: none; }
        .d-pad, .action-buttons { display: flex; gap: 20px; pointer-events: auto; }
        .btn { width: 70px; height: 70px; background: rgba(255, 255, 255, 0.3); border: 4px solid #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; user-select: none; cursor: pointer; font-size: 24px; -webkit-tap-highlight-color: transparent; }
        .btn:active { background: rgba(255, 255, 255, 0.7); transform: scale(0.9); }
        #jumpBtn { background: rgba(255, 0, 0, 0.4); width: 85px; height: 85px; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="marioCanvas"></canvas>
    
    <div class="controls">
        <div class="d-pad">
            <div class="btn" id="leftBtn">◀</div>
            <div class="btn" id="rightBtn">▶</div>
        </div>
        <div class="action-buttons">
            <div class="btn" id="jumpBtn">PULO</div>
        </div>
    </div>
</div>

<script>
window.onload = function() {
    const canvas = document.getElementById('marioCanvas');
    const ctx = canvas.getContext('2d');

    // Resolução interna
    canvas.width = 800;
    canvas.height = 450;

    // --- CARREGAMENTO DE ASSETS ---
    const marioImg = new Image();
    // Link de um sprite do Mario (pode trocar pela sua foto aqui)
    marioImg.src = 'https://private-user-images.githubusercontent.com/71620144/551118904-7268798a-ea0a-43fa-9b0b-79891c5bf9df.png?jwt=eyJ0eXAiOiJKV1QiLCJhbGciOiJIUzI1NiJ9.eyJpc3MiOiJnaXRodWIuY29tIiwiYXVkIjoicmF3LmdpdGh1YnVzZXJjb250ZW50LmNvbSIsImtleSI6ImtleTUiLCJleHAiOjE3NzEzNTE2MTksIm5iZiI6MTc3MTM1MTMxOSwicGF0aCI6Ii83MTYyMDE0NC81NTExMTg5MDQtNzI2ODc5OGEtZWEwYS00M2ZhLTliMGItNzk4OTFjNWJmOWRmLnBuZz9YLUFtei1BbGdvcml0aG09QVdTNC1ITUFDLVNIQTI1NiZYLUFtei1DcmVkZW50aWFsPUFLSUFWQ09EWUxTQTUzUFFLNFpBJTJGMjAyNjAyMTclMkZ1cy1lYXN0LTElMkZzMyUyRmF3czRfcmVxdWVzdCZYLUFtei1EYXRlPTIwMjYwMjE3VDE4MDE1OVomWC1BbXotRXhwaXJlcz0zMDAmWC1BbXotU2lnbmF0dXJlPWU3Y2Y4OWIyYmIyYjUzNGRkNmM2YzFkNDk2ZTY2N2VlNjJlNGZmMmI0MWUwMDI3MTY3NTJmNzYxNjlkZmMxNjAmWC1BbXotU2lnbmVkSGVhZGVycz1ob3N0In0.F8sRW2uye7y1zV-s0r3IG1uZTa-hPWqwZjHM3UtnKIo';

    // Variáveis de Ambiente
    const gravity = 0.6;
    const friction = 0.85;
    let gameWon = false;
    const camera = { y: 0 };

    // Jogador
    const player = {
        x: 400,
        y: 350,
        width: 45,
        height: 45,
        speed: 6,
        velX: 0,
        velY: 0,
        jumping: false,
        facingLeft: false // Controla para onde a imagem olha
    };

    // Gerar Plataformas (Chão + 15 degraus)
    const platforms = [{ x: 0, y: 400, width: 800, height: 100 }];
    for (let i = 1; i <= 15; i++) {
        platforms.push({
            x: Math.random() * (canvas.width - 150),
            y: 400 - (i * 130),
            width: 140,
            height: 25
        });
    }

    // Objetivo final na última plataforma
    const lastP = platforms[platforms.length - 1];
    const goal = { x: lastP.x + 50, y: lastP.y - 120, width: 15, height: 120 };

    // Estados de Input
    const keys = {};
    let touchLeft = false, touchRight = false;

    // Listeners Teclado
    window.addEventListener("keydown", e => keys[e.code] = true);
    window.addEventListener("keyup", e => keys[e.code] = false);

    // Listeners Touch
    function setupTouch(id, cb) {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); cb(true); });
        el.addEventListener('touchend', (e) => { e.preventDefault(); cb(false); });
    }

    setupTouch('leftBtn', v => touchLeft = v);
    setupTouch('rightBtn', v => touchRight = v);
    document.getElementById('jumpBtn').addEventListener('touchstart', (e) => {
        e.preventDefault();
        if (!player.jumping && !gameWon) { player.velY = -16; player.jumping = true; }
    });

    function update() {
        if (gameWon) return;

        // Lógica de Movimento
        if (keys["ArrowRight"] || touchRight) { 
            if (player.velX < player.speed) player.velX++; 
            player.facingLeft = false;
        }
        if (keys["ArrowLeft"] || touchLeft) { 
            if (player.velX > -player.speed) player.velX--; 
            player.facingLeft = true;
        }

        if ((keys["Space"] || keys["ArrowUp"]) && !player.jumping) {
            player.velY = -16;
            player.jumping = true;
        }

        // Aplicar Física
        player.velX *= friction;
        player.velY += gravity;
        player.x += player.velX;
        player.y += player.velY;

        // Câmera Suave Vertical
        let targetCamY = player.y - canvas.height / 2;
        if (targetCamY < camera.y) {
            camera.y += (targetCamY - camera.y) * 0.1;
        }

        // Colisões com Plataformas
        player.jumping = true;
        for (let p of platforms) {
            if (player.x + 10 < p.x + p.width && 
                player.x + player.width - 10 > p.x &&
                player.y + player.height > p.y && 
                player.y + player.height < p.y + p.height + player.velY + 1) {
                
                if (player.velY > 0) {
                    player.jumping = false;
                    player.y = p.y - player.height;
                    player.velY = 0;
                }
            }
        }

        // Vitória
        if (player.x < goal.x + goal.width && player.x + player.width > goal.x &&
            player.y < goal.y + goal.height && player.y + player.height > goal.y) {
            gameWon = true;
        }

        // Limites
        if (player.x < 0) player.x = 0;
        if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;

        // Reset ao Cair
        if (player.y > camera.y + canvas.height + 200) {
            player.x = 400; player.y = 350; player.velY = 0; camera.y = 0;
        }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(0, -camera.y);

        // Desenhar Chão e Plataformas
        for (let p of platforms) {
            ctx.fillStyle = "#8B4513"; // Marrom
            ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.fillStyle = "#2ECC71"; // Grama
            ctx.fillRect(p.x, p.y, p.width, 8);
        }

        // Desenhar Mastro de Vitória
        ctx.fillStyle = "#333";
        ctx.fillRect(goal.x, goal.y, goal.width, goal.height);
        ctx.fillStyle = "red";
        ctx.fillRect(goal.x + goal.width, goal.y, 30, 25);

        // Desenhar Jogador com Espelhamento (Flip)
        if (marioImg.complete) {
            ctx.save();
            if (player.facingLeft) {
                // Inverte a imagem horizontalmente
                ctx.translate(player.x + player.width, player.y);
                ctx.scale(-1, 1);
                ctx.drawImage(marioImg, 0, 0, player.width, player.height);
            } else {
                ctx.drawImage(marioImg, player.x, player.y, player.width, player.height);
            }
            ctx.restore();
        } else {
            ctx.fillStyle = "red";
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }

        ctx.restore();

        // Tela de Vitória
        if (gameWon) {
            ctx.fillStyle = "rgba(0,0,0,0.8)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#FFF";
            ctx.textAlign = "center";
            ctx.font = "bold 40px Arial";
            ctx.fillText("VITÓRIA!", canvas.width/2, canvas.height/2);
            ctx.font = "20px Arial";
            ctx.fillText("Você dominou a montanha!", canvas.width/2, canvas.height/2 + 50);
        }

        requestAnimationFrame(draw);
        update();
    }

    draw();
};
</script>
</body>
</html>
