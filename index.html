<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mario - Plataformas Ajustadas</title>
    <style>
        body { margin: 0; background-color: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; font-family: sans-serif; }
        #game-container { position: relative; width: 100%; max-width: 800px; aspect-ratio: 16 / 9; background-color: #5C94FC; border: 4px solid #000; overflow: hidden; }
        canvas { width: 100%; height: 100%; image-rendering: pixelated; }
        .controls { position: absolute; bottom: 15px; width: 100%; display: flex; justify-content: space-between; padding: 0 30px; box-sizing: border-box; pointer-events: none; }
        .d-pad, .action-buttons { display: flex; gap: 20px; pointer-events: auto; }
        .btn { width: 70px; height: 70px; background: rgba(255, 255, 255, 0.3); border: 4px solid #fff; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-weight: bold; color: white; user-select: none; cursor: pointer; font-size: 24px; }
        #jumpBtn { background: rgba(255, 0, 0, 0.4); width: 85px; height: 85px; }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="marioCanvas"></canvas>
    <div class="controls">
        <div class="d-pad">
            <div class="btn" id="leftBtn">◀</div>
            <div class="btn" id="rightBtn">▶</div>
        </div>
        <div class="action-buttons"><div class="btn" id="jumpBtn">PULO</div></div>
    </div>
</div>

<script>
window.onload = function() {
    const canvas = document.getElementById('marioCanvas');
    const ctx = canvas.getContext('2d');
    canvas.width = 800; canvas.height = 450;

    const marioImg = new Image();
    marioImg.src = 'https://raw.githubusercontent.com/phelipesete/game/refs/heads/main/juu.png';

    const gravity = 0.6;
    const friction = 0.85;
    let gameWon = false;
    const camera = { y: 0 };

    const player = {
        x: 400, y: 350, width: 150, height: 150,
        speed: 6, velX: 0, velY: 0, jumping: false, facingLeft: false
    };

    // GERAÇÃO DE FASE JUSTA
    const platforms = [{ x: 0, y: 400, width: 800, height: 100 }];
    for (let i = 1; i <= 20; i++) {
        const lastP = platforms[i - 1];
        let newX = lastP.x + (Math.random() * 400 - 200); // Max 130px de distância lateral
        if (newX < 50) newX = 50;
        if (newX > canvas.width - 150) newX = canvas.width - 190;

        platforms.push({
            x: newX,
            y: 400 - (i * 165), // Distância vertical de 105px (fácil)
            width: 140, height: 25
        });
    }

    const lastP = platforms[platforms.length - 1];
    const goal = { x: lastP.x + 50, y: lastP.y - 120, width: 15, height: 120 };

    const keys = {};
    let touchLeft = false, touchRight = false;
    window.addEventListener("keydown", e => keys[e.code] = true);
    window.addEventListener("keyup", e => keys[e.code] = false);

    function setupTouch(id, cb) {
        const el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); cb(true); });
        el.addEventListener('touchend', (e) => { e.preventDefault(); cb(false); });
    }
    setupTouch('leftBtn', v => touchLeft = v);
    setupTouch('rightBtn', v => touchRight = v);
    document.getElementById('jumpBtn').addEventListener('touchstart', (e) => {
        e.preventDefault(); if (!player.jumping && !gameWon) { player.velY = -17; player.jumping = true; }
    });

    function update() {
        if (gameWon) return;
        if (keys["ArrowRight"] || touchRight) { player.velX < player.speed && player.velX++; player.facingLeft = false; }
        if (keys["ArrowLeft"] || touchLeft) { player.velX > -player.speed && player.velX--; player.facingLeft = true; }
        if ((keys["Space"] || keys["ArrowUp"]) && !player.jumping) { player.velY = -16; player.jumping = true; }

        player.velX *= friction; player.velY += gravity;
        player.x += player.velX; player.y += player.velY;

        let targetCamY = player.y - canvas.height / 2;
        if (targetCamY < camera.y) camera.y += (targetCamY - camera.y) * 0.1;

        player.jumping = true;
        for (let p of platforms) {
            if (player.x + 10 < p.x + p.width && player.x + player.width - 10 > p.x &&
                player.y + player.height > p.y && player.y + player.height < p.y + p.height + player.velY + 1) {
                if (player.velY > 0) { player.jumping = false; player.y = p.y - player.height; player.velY = 0; }
            }
        }

        if (player.x < goal.x + goal.width && player.x + player.width > goal.x && player.y < goal.y + goal.height && player.y + player.height > goal.y) gameWon = true;
        if (player.x < 0) player.x = 0;
        if (player.x + player.width > canvas.width) player.x = canvas.width - player.width;
        if (player.y > camera.y + canvas.height + 200) { player.x = 400; player.y = 350; player.velY = 0; camera.y = 0; }
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(0, -camera.y);
        for (let p of platforms) {
            ctx.fillStyle = "#8B4513"; ctx.fillRect(p.x, p.y, p.width, p.height);
            ctx.fillStyle = "#2ECC71"; ctx.fillRect(p.x, p.y, p.width, 8);
        }
        ctx.fillStyle = "#333"; ctx.fillRect(goal.x, goal.y, goal.width, goal.height);
        ctx.fillStyle = "red"; ctx.fillRect(goal.x + goal.width, goal.y, 30, 25);

        if (marioImg.complete) {
            ctx.save();
            if (player.facingLeft) { ctx.translate(player.x + player.width, player.y); ctx.scale(-1, 1); ctx.drawImage(marioImg, 0, 0, player.width, player.height); }
            else { ctx.drawImage(marioImg, player.x, player.y, player.width, player.height); }
            ctx.restore();
        }
        ctx.restore();

        if (gameWon) {
            ctx.fillStyle = "rgba(0,0,0,0.8)"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#FFF"; ctx.textAlign = "center"; ctx.font = "bold 40px Arial"; ctx.fillText("VITÓRIA!", canvas.width/2, canvas.height/2);
        }
        requestAnimationFrame(draw); update();
    }
    draw();
};
</script>
</body>
</html>
